services:
  - type: web
    name: hr-workbench
    runtime: node
    plan: free
    region: oregon
    branch: master
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # 可选：填一个外部免费 Postgres 的连接串即可让数据持久化（不填则用本地文件，重部署会重置）
      # - key: DATABASE_URL
      #   value: postgres://user:pass@host:5432/dbname
