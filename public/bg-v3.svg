    <circle cx="1540" cy="120" r="0.9"/>
    <circle cx="1700" cy="70" r="0.7"/>
    <circle cx="1840" cy="110" r="1.0"/>

    <circle cx="80" cy="220" r="0.8"/>
    <circle cx="320" cy="260" r="1.0"/>
    <circle cx="500" cy="200" r="0.9"/>
    <circle cx="680" cy="280" r="0.7"/>
    <circle cx="860" cy="230" r="1.1"/>
    <circle cx="1040" cy="270" r="0.8"/>
    <circle cx="1220" cy="210" r="1.0"/>
    <circle cx="1400" cy="250" r="0.9"/>
    <circle cx="1580" cy="200" r="0.8"/>
    <circle cx="1760" cy="280" r="1.0"/>

    <circle cx="160" cy="400" r="0.9"/>
    <circle cx="340" cy="450" r="0.7"/>
    <circle cx="520" cy="380" r="1.0"/>
    <circle cx="700" cy="430" r="0.8"/>
    <circle cx="880" cy="360" r="0.9"/>
    <circle cx="1060" cy="410" r="1.0"/>
    <circle cx="1240" cy="350" r="0.8"/>
    <circle cx="1420" cy="440" r="0.9"/>
    <circle cx="1600" cy="390" r="0.7"/>
    <circle cx="1780" cy="450" r="1.1"/>

    <circle cx="120" cy="580" r="0.8"/>
    <circle cx="300" cy="620" r="1.0"/>
    <circle cx="480" cy="560" r="0.9"/>
    <circle cx="660" cy="640" r="0.8"/>
    <circle cx="840" cy="570" r="1.0"/>
    <circle cx="1020" cy="630" r="0.9"/>
    <circle cx="1200" cy="550" r="0.7"/>
    <circle cx="1380" cy="610" r="1.1"/>
    <circle cx="1560" cy="580" r="0.9"/>
