    <line x1="1440" y1="0" x2="1440" y2="1080"/>
    <line x1="1520" y1="0" x2="1520" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
    <line x1="1680" y1="0" x2="1680" y2="1080"/>
    <line x1="1760" y1="0" x2="1760" y2="1080"/>
    <line x1="1840" y1="0" x2="1840" y2="1080"/>
  </g>

  <!-- 透视网格地平线 -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="1080" x2="960" y2="540"/>
    <line x1="240" y1="1080" x2="1000" y2="540"/>
    <line x1="480" y1="1080" x2="1040" y2="540"/>
    <line x1="720" y1="1080" x2="1080" y2="540"/>
    <line x1="960" y1="1080" x2="1120" y2="540"/>
    <line x1="1200" y1="1080" x2="1160" y2="540"/>
    <line x1="1440" y1="1080" x2="1200" y2="540"/>
    <line x1="1680" y1="1080" x2="1240" y2="540"/>
    <line x1="1920" y1="1080" x2="1280" y2="540"/>

    <line x1="-300" y1="940" x2="2220" y2="940"/>
    <line x1="-150" y1="840" x2="2070" y2="840"/>
    <line x1="0" y1="740" x2="1920" y2="740"/>
    <line x1="150" y1="640" x2="1770" y2="640"/>
    <line x1="300" y1="540" x2="1620" y2="540"/>
  </g>

  <!-- 主流动曲线（霓虹蓝紫） -->
  <path d="M0 360 C 280 300, 520 420, 860 360 S 1420 280, 1920 340" fill="none" stroke="url(#flowGrad)" stroke-width="3" opacity="0.55" filter="url(#blurS)"/>
  <path d="M0 360 C 280 300, 520 420, 860 360 S 1420 280, 1920 340" fill="none" stroke="url(#flowGrad)" stroke-width="1.2" opacity="0.9"/>

  <path d="M0 420 C 320 470, 560 360, 920 430 S 1480 490, 1920 420" fill="none" stroke="url(#flowGrad2)" stroke-width="2.5" opacity="0.45" filter="url(#blurS)"/>
  <path d="M0 420 C 320 470, 560 360, 920 430 S 1480 490, 1920 420" fill="none" stroke="url(#flowGrad2)" stroke-width="1" opacity="0.85"/>

  <path d="M0 480 C 260 430, 540 540, 900 480 S 1460 400, 1920 470" fill="none" stroke="url(#flowGrad)" stroke-width="2" opacity="0.40" filter="url(#blurS)"/>
  <path d="M0 480 C 260 430, 540 540, 900 480 S 1460 400, 1920 470" fill="none" stroke="url(#flowGrad)" stroke-width="0.9" opacity="0.75"/>

  <path d="M0 520 C 340 560, 600 460, 980 520 S 1520 580, 1920 510" fill="none" stroke="url(#flowGrad2)" stroke-width="1.8" opacity="0.35" filter="url(#blurS)"/>
  <path d="M0 520 C 340 560, 600 460, 980 520 S 1520 580, 1920 510" fill="none" stroke="url(#flowGrad2)" stroke-width="0.8" opacity="0.70"/>

  <path d="M0 280 C 380 220, 640 340, 1020 280 S 1600 200, 1920 270" fill="none" stroke="rgba(106,140,255,0.20)" stroke-width="1.5" opacity="0.50"/>
  <path d="M0 580 C 300 630, 580 530, 940 590 S 1500 650, 1920 570" fill="none" stroke="rgba(157,106,255,0.18)" stroke-width="1.5" opacity="0.45"/>

  <!-- 玻璃拟态光斑（多个大小） -->
  <circle cx="180" cy="750" r="160" fill="url(#orbLight)" filter="url(#blurM)"/>
  <circle cx="1740" cy="180" r="130" fill="url(#orbLight)" filter="url(#blurM)"/>
  <circle cx="1580" cy="820" r="100" fill="url(#orbLight)" filter="url(#blurM)"/>
  <circle cx="420" cy="240" r="90" fill="url(#orbColor)" filter="url(#blurM)"/>
  <circle cx="1380" cy="680" r="80" fill="url(#orbColor)" filter="url(#blurM)"/>
  <circle cx="620" cy="920" r="110" fill="url(#orbColor)" filter="url(#blurL)"/>
  <circle cx="1080" cy="120" r="70" fill="url(#orbLight)" filter="url(#blurM)"/>

  <!-- 微小粒子/星尘 -->
