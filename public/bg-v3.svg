<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 主渐变：深海军蓝 → 紫罗兰 → 冰蓝 -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a18"/>
      <stop offset="25%" stop-color="#0f1230"/>
      <stop offset="50%" stop-color="#181536"/>
      <stop offset="75%" stop-color="#122449"/>
      <stop offset="100%" stop-color="#0b1c33"/>
    </linearGradient>

    <!-- 柔和紫罗兰顶光 -->
    <radialGradient id="glowViolet" cx="65%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#7b5cff" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#6a4af0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6a4af0" stop-opacity="0"/>
    </radialGradient>

    <!-- 冰蓝右侧光 -->
    <radialGradient id="glowIce" cx="90%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#4da6ff" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#3d8fe6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#3d8fe6" stop-opacity="0"/>
    </radialGradient>

    <!-- 底部蓝紫光 -->
    <radialGradient id="glowBottom" cx="20%" cy="95%" r="50%">
      <stop offset="0%" stop-color="#5c6bff" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#4a58e0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4a58e0" stop-opacity="0"/>
    </radialGradient>

    <!-- 玻璃拟态光斑 -->
    <radialGradient id="orbLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbColor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b5cff" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#6a4af0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6a4af0" stop-opacity="0"/>
    </radialGradient>

    <!-- 流动曲线渐变 -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6a8cff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#6a8cff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#9d6aff" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#4da6ff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#4da6ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="flowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4da6ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#4da6ff" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#9d6aff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9d6aff" stop-opacity="0"/>
    </linearGradient>

    <filter id="blurXXL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="110"/>
    </filter>
    <filter id="blurXL" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="blurL" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blurM" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="blurS" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- 底色 -->
  <rect width="1920" height="1080" fill="url(#mainGrad)"/>

  <!-- 大面积柔和光晕 -->
  <ellipse cx="1250" cy="120" rx="700" ry="420" fill="url(#glowViolet)" filter="url(#blurXXL)"/>
  <ellipse cx="1700" cy="850" rx="550" ry="380" fill="url(#glowIce)" filter="url(#blurXL)"/>
  <ellipse cx="220" cy="920" rx="500" ry="320" fill="url(#glowBottom)" filter="url(#blurXL)"/>

  <!-- 中部柔和蓝紫光雾 -->
  <ellipse cx="960" cy="540" rx="800" ry="400" fill="url(#orbColor)" filter="url(#blurXXL)"/>

  <!-- 细密数字网格（水平+垂直） -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="0.6">
    <line x1="0" y1="60" x2="1920" y2="60"/>
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="0" y1="300" x2="1920" y2="300"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="420" x2="1920" y2="420"/>
    <line x1="0" y1="480" x2="1920" y2="480"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="660" x2="1920" y2="660"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="780" x2="1920" y2="780"/>
    <line x1="0" y1="840" x2="1920" y2="840"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
    <line x1="0" y1="960" x2="1920" y2="960"/>
    <line x1="0" y1="1020" x2="1920" y2="1020"/>

    <line x1="80" y1="0" x2="80" y2="1080"/>
    <line x1="160" y1="0" x2="160" y2="1080"/>
    <line x1="240" y1="0" x2="240" y2="1080"/>
    <line x1="320" y1="0" x2="320" y2="1080"/>
