  <!-- 更亮的稀疏星光 -->
  <g fill="rgba(255,255,255,0.85)">
    <circle cx="230" cy="120" r="0.9"/>
    <circle cx="700" cy="180" r="1.1"/>
    <circle cx="1150" cy="160" r="0.9"/>
