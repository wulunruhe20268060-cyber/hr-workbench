        </button>
        <input type="file" id="contractUpload" accept=".csv,.txt,.xlsx,.xls" style="display:none" onchange="handleContractUpload(event)">
        <button class="btn btn-outline btn-sm" onclick="downloadContractTemplate()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>下载模板
        </button>
        <button class="btn btn-outline btn-sm" onclick="exportContracts()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导出表格
        </button>
        <button class="btn btn-primary btn-sm" onclick="showAddContract()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新增合同
        </button>
      </div>
    </div>`;

  // Expiring soon warning (15 days + expired)
  const expiringSoon = contracts.filter(c => {
    if (!c.endDate) return false;
    const end = new Date(c.endDate); end.setHours(0,0,0,0);
    const todayDate = new Date(todayStr); todayDate.setHours(0,0,0,0);
    const days = Math.ceil((end - todayDate) / 86400000);
    return days <= 15;
  });
  const expiredCount = expiringSoon.filter(c => {
    const end = new Date(c.endDate); end.setHours(0,0,0,0);
    const todayDate = new Date(todayStr); todayDate.setHours(0,0,0,0);
    return Math.ceil((end - todayDate) / 86400000) < 0;
  }).length;
  const shortCount = expiringSoon.length - expiredCount;

  if (expiringSoon.length > 0) {
    html += `<div style="background:#FFECE8;border:1px solid #FFD6D6;border-radius:8px;padding:12px;margin-bottom:12px">
      <div style="font-weight:600;color:var(--danger);font-size:14px;margin-bottom:4px">⚠️ ${expiredCount > 0 ? expiredCount + ' 份已超期，' : ''}${shortCount} 份合同15天内到期</div>
      ${expiringSoon.map(c => {
        const end = new Date(c.endDate); end.setHours(0,0,0,0);
        const todayDate = new Date(todayStr); todayDate.setHours(0,0,0,0);
        const days = Math.ceil((end - todayDate) / 86400000);
        return `<span style="display:inline-block;background:${days<0?'#FFECE8':'#FFF7E8'};color:${days<0?'var(--danger)':'#873800'};padding:2px 8px;border-radius:4px;margin:2px;font-size:12px">${escapeHtml(c.name)} ${c.endDate}${days<0?' (超期)':' ('+days+'天)'}</span>`;
      }).join('')}
    </div>`;
  }

  if (contracts.length === 0) {
    html += `<div style="text-align:center;color:var(--text2);padding:20px">暂无合同记录，点击上方上传或新增</div></div>`;
    document.getElementById('moduleContent').innerHTML = html;
    return;
  }

  // Sort by days until expiry (ascending): expired → soonest expiry first
  const todayMs = new Date(todayStr).setHours(0,0,0,0);
  const parseDateMs = (d) => {
    if (!d) return Infinity;
    const s = String(d).trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3])).setHours(0,0,0,0);
    m = s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})/);
    if (m) return new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3])).setHours(0,0,0,0);
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
    if (m) { let y = parseInt(m[3]); if (y < 100) y += 2000; return new Date(y, parseInt(m[1])-1, parseInt(m[2])).setHours(0,0,0,0); }
    return new Date(s).setHours(0,0,0,0) || Infinity;
  };
  contracts.sort((a,b) => {
    const da = parseDateMs(a.endDate) - todayMs;
    const db = parseDateMs(b.endDate) - todayMs;
    return da - db;
  });
  contracts.forEach((c, i) => { c.seq = i + 1; });

  html += `<div class="batch-delete-bar" style="display:none;background:#FFECE8;border:1px solid #FFD6D6;border-radius:8px;padding:10px 12px;margin-bottom:8px">
    <span style="color:var(--danger);font-weight:600">已选 <span class="batch-count">0</span> 项</span>
    <button class="btn btn-danger btn-sm" style="margin-left:12px" onclick="batchDeleteContracts()">批量删除</button>
    <button class="btn btn-outline btn-sm" style="margin-left:8px" onclick="document.querySelectorAll('.row-checkbox').forEach(cb=>cb.checked=false);updateBatchDeleteBar()">取消</button>
  </div>`;

  html += `<div style="overflow-x:auto"><table class="pos-table">
    <tr><th style="width:40px"><input type="checkbox" onchange="toggleAllRows(this)"></th><th>序号</th><th>员工姓名</th><th>部门</th><th>入职日期</th><th>签订日期</th><th>合同约期</th><th>到期日期</th><th>倒计时</th><th>签订单位</th><th>备注</th><th>操作</th></tr>`;

  const allContracts = [...contracts];
  const pagedContracts = paginate(allContracts, contractPage, contractPageSize);
  pagedContracts.forEach(c => {
    const days = c.endDate ? Math.ceil((new Date(c.endDate).setHours(0,0,0,0) - new Date(todayStr).setHours(0,0,0,0)) / 86400000) : 999;
    let countdown = '-';
    let rowClass = '';
    if (days < 0) { countdown = `<span style="color:var(--danger);font-weight:600">已过期${Math.abs(days)}天</span>`; rowClass = 'style="background:#FFECE8"'; }
    else if (days === 0) { countdown = `<span style="color:var(--danger);font-weight:600">今天到期</span>`; rowClass = 'style="background:#FFECE8"'; }
    else if (days <= 15) { countdown = `<span style="color:var(--danger);font-weight:600">${days}天</span>`; rowClass = 'style="background:#FFF7E8"'; }
    else if (days <= 30) { countdown = `<span style="color:var(--warning);font-weight:500">${days}天</span>`; }
    else countdown = `${days}天`;

    const fmtDate = (d) => {
      if (!d) return '-';
      const s = String(d).trim();
      let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) return parseInt(m[1]) + '/' + parseInt(m[2]) + '/' + parseInt(m[3]);
      m = s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})/);
      if (m) return parseInt(m[1]) + '/' + parseInt(m[2]) + '/' + parseInt(m[3]);
      m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if (m) {
        let y = parseInt(m[3]);
        if (y < 100) y += 2000;
        return y + '/' + parseInt(m[1]) + '/' + parseInt(m[2]);
      }
      return s;
    };

    html += `<tr ${rowClass}>
      <td><input type="checkbox" class="row-checkbox" data-id="${c.id}" onchange="updateBatchDeleteBar()"></td>
      <td>${c.seq}</td>
      <td style="white-space:nowrap"><strong>${escapeHtml(c.name)}</strong></td>
      <td style="white-space:nowrap">${escapeHtml(c.dept||'-')}</td>
      <td style="white-space:nowrap">${fmtDate(c.entryDate)}</td>
      <td style="white-space:nowrap">${fmtDate(c.signDate)}</td>
      <td style="white-space:nowrap">${escapeHtml(String(c.duration||'-'))}</td>
      <td style="white-space:nowrap">${c.endDate||'-'}</td>
      <td style="white-space:nowrap">${countdown}</td>
      <td style="max-width:120px;font-size:12px;white-space:nowrap">${escapeHtml(c.signUnit||'-')}</td>
      <td style="max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px" title="${escapeHtml(c.notes||'')}">${escapeHtml(c.notes||'-')}</td>
      <td style="white-space:nowrap"><button class="btn btn-outline btn-xs" onclick="editContract('${c.id}')">编辑</button><button class="btn btn-danger btn-xs" onclick="deleteContract('${c.id}')">删除</button></td>
    </tr>`;
  });

  html += `</table>`;
  html += renderPagination(allContracts.length, contractPage, contractPageSize, 'contract');
  html += `</div></div>`;
  document.getElementById('moduleContent').innerHTML = html;
}

async function handleContractUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const rows = await parseUploadedSpreadsheet(file);
  if (rows.length === 0) { showToast('未解析到数据'); return; }
  const items = rows.map((r, i) => {
    const durRaw = r['合同约期（年）'] !== undefined ? r['合同约期（年）'] :
                   r['合同约期(年)'] !== undefined ? r['合同约期(年)'] :
                   r['合同约期'] !== undefined ? r['合同约期'] :
                   r['duration'];
    return {
      seq: r['序号'] !== undefined && r['序号'] !== '' ? parseInt(r['序号']) : (i + 1),
      name: r['员工姓名'] || r['员工'] || r['姓名'] || r['name'] || '',
      dept: r['部门'] || r['dept'] || '',
      entryDate: r['入职日期'] || r['entryDate'] || '',
      signDate: r['签订日期'] || r['signDate'] || '',
      duration: durRaw !== undefined && durRaw !== '' ? parseInt(String(durRaw).replace(/[^0-9]/g, '')) : null,
      endDate: r['到期日期'] || r['endDate'] || '',
      signUnit: r['签订单位'] || r['signUnit'] || '',
      notes: r['备注'] || r['notes'] || ''
    };
  }).filter(x => x.name);
  if (items.length === 0) { showToast('未识别有效数据'); event.target.value = ''; return; }
  if (!confirm(`解析到 ${items.length} 条合同，确认导入？`)) { event.target.value = ''; return; }
  try {
    const res = await apiPost('/api/contracts/batch', { items });
    event.target.value = ''; await render();
    showToast(`导入完成：${res.count} 条合同`);
  } catch(e) { showToast(e.message); event.target.value = ''; }
}

function checkLocalStorageMigration() {
  // Check for first-version data in localStorage
  const oldKeys = ['wb_hr_positions', 'wb_hr_interviews', 'wb_hr_todos', 'wb_hr_templates', 'wb_hr_hires'];
  let foundCount = 0;
  const found = {};
  oldKeys.forEach(k => {
    try {
      const d = localStorage.getItem(k);
      if (d) {
        const parsed = JSON.parse(d);
        if (Array.isArray(parsed) && parsed.length > 0) {
          foundCount += parsed.length;
        }
      }
    } catch(e) {}
  });
  
  if (foundCount === 0) return;
  
  // Show a non-blocking banner
  const teamSection = document.getElementById('teamOverview');
  const banner = document.createElement('div');
  banner.style.cssText = 'background:#FFF7E8;border:1px solid #FFC069;border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px';
  banner.innerHTML = `
    <div style="font-size:14px">
      <strong>🔍 检测到旧版数据</strong>
      <span style="color:var(--text2);font-size:12px">（浏览器中存有 ${foundCount} 条旧版工作记录）</span>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-warning btn-sm" onclick="migrateLocalStorage()">导入到当前版本</button>
      <button class="btn btn-outline btn-sm" onclick="this.closest('div').parentElement.remove()">忽略</button>
    </div>`;
  teamSection.parentElement.insertBefore(banner, teamSection);
}

async function migrateLocalStorage() {
  const oldKeys = {
    positions: 'wb_hr_positions',
    interviews: 'wb_hr_interviews',
    todos: 'wb_hr_todos',
    templates: 'wb_hr_templates',
    hires: 'wb_hr_hires'
  };
  
  const data = {};
  Object.entries(oldKeys).forEach(([name, key]) => {
    try {
      const d = localStorage.getItem(key);
      if (d) {
        data[name] = JSON.parse(d);
      }
    } catch(e) {}
  });
  
  const total = Object.values(data).reduce((s, arr) => s + (Array.isArray(arr) ? arr.length : 0), 0);
  if (total === 0) { showToast('未找到可迁移的数据'); return; }
  
  try {
    const res = await apiPost('/api/migrate', data);
    showToast(res.message || `已迁移 ${total} 条数据`);
    // Remove the banner
    const banner = document.querySelector('[style*="fef3c7"]');
    if (banner) banner.remove();
    await render();
  } catch(e) {
    showToast('迁移失败: ' + (e.message || '请稍后重试'));
  }
}

async function aiGen(endpoint, body, btn) {
  const old = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'AI 生成中…'; }
  try {
    return await apiPost(endpoint, body);
  } catch (e) {
    showToast('AI 调用失败：' + (e.message || '请稍后重试'));
    return null;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = old; }
  }
}

  h += `<div class="ai-row">` + fld('电话','rb_'+i+'_phone', b.phone) + fld('当前薪资','rb_'+i+'_cs', b.currentSalary) + fld('期望薪资','rb_'+i+'_es', b.expectedSalary) + `</div>`;

  h += `<div class="ai-muted" style="margin:6px 0">技能：${(item.parsed?.skills||[]).join('、')||'—'}</div>`;
  h += `<div class="ai-muted" style="margin:6px 0">证书：${(item.parsed?.certificates||[]).join('、')||'—'}</div>`;
  if (item.match) h += `<div class="ai-muted">匹配度：<b>${item.match.score}</b> 分 ｜ ${escapeHtml(item.match.summary||'')}</div>`;

  h += `</div>`;
  return h;
}

async function handleResumeFiles(input) {
  const files = Array.from(input.files||[]);
  for (const f of files) {
    const item = { fileName: f.name, mime: f.type, text:'', parsed:null, match:null, anomaly:null, extracting:true };
    recruitAIState.batch.push(item);
    renderResumeParse();
    try {
      const base64 = await fileToBase64(f);
      const r = await apiPost('/api/ai/extract-resume', { fileName: f.name, mime: f.type, data: base64 });
      item.text = r.text || '';
      if (!item.text) showToast('未能从「'+f.name+'」提取文本（可能加密或损坏）');
    } catch (e) {
      showToast('提取失败：'+(e.message||f.name));
    } finally {
      item.extracting = false;
      renderResumeParse();
    }
  }
  input.value = '';
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => { const res = String(fr.result||''); const c = res.indexOf(','); resolve(c>=0 ? res.slice(c+1) : res); };
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}

async function aiParseAll() {
  if (!recruitAIState.batch.length) { showToast('请先上传简历'); return; }
  const jobId = val('rs_job');
  const job = recruitAIState.jobs.find(j => j.id === jobId);
  let n = 0;
  for (let i=0;i<recruitAIState.batch.length;i++) {
    const item = recruitAIState.batch[i];
    if (item.parsed || item.extracting || !item.text || !item.text.trim()) continue;
    const r = await aiGen('/api/ai/parse-resume', { text: item.text }, null);
    if (r) item.parsed = r;
    if (item.parsed) { await autoSaveCandidate(item, job); n++; }
    renderResumeParse();
  }
  showToast(n ? ('解析完成，已自动存入候选人库（' + n + ' 位）') : '全部解析完成');
}

// ---------- AI 生成结果自动保存（去重 upsert，刷新/重部署不丢） ----------
// 先按 matchFn 查重，已存在则 PUT 更新，否则 POST 新建。避免每次生成都产生重复记录。
async function upsertRecord(cap, body, matchFn) {
  try {
    const list = await apiGet('/api/' + cap).catch(() => []);
    const existing = (list || []).find(matchFn);
    if (existing) {
      await apiPut('/api/' + cap + '/' + existing.id, body);
      return existing;
    }
    return await apiPost('/api/' + cap, body);
  } catch (e) {
    showToast('自动保存失败：' + (e.message || ''));
    return null;
  }
}

// 简历解析结果 → 候选人库（按 姓名+电话 去重）
async function autoSaveCandidate(item, job) {
  if (!item || !item.parsed) return null;
  const b = item.parsed.basic || {};
  const c = {
    name: b.name || '未命名',
    position: b.applyPosition || (job ? job.position : ''),
    parsed: {
      basic: b,
      education: item.parsed.education || [],
      work: item.parsed.work || [],
      skills: item.parsed.skills || [],
      certificates: item.parsed.certificates || []
    },
    matchScore: item.match ? (item.match.score ?? null) : null,
    matchDetail: item.match || null,
    anomalies: item.anomaly || null,
    tags: [],
    sourceFile: item.fileName || ''
  };
  return await upsertRecord('candidates', c, x =>
    (x.name || '') === (c.name || '') &&
    ((x.parsed && x.parsed.basic && x.parsed.basic.phone) || '') === (b.phone || '')
  );
}

// 题本 → questionBanks（按 candidateId 去重）
async function autoSaveQuestionBank() {
  const r = recruitAIState.questionsResult;
  const cand = recruitAIState._qbCand, job = recruitAIState._qbJob;
  if (!r || !cand || !job) return null;
  const title = cand.name + job.position + today();
  const body = {
    candidateId: cand.id, candidateName: cand.name,
    position: job.position, jobSpecId: job.id,
    title, questions: r.questions, scoreTable: r.scoreTable || []
  };
  return await upsertRecord('questionBanks', body, x => x.candidateId === cand.id);
}

// 决策 → hiringDecisions（按 candidateId 去重）
async function autoSaveDecision() {
  const r = recruitAIState.decisionResult;
  const candId = val('dc_cand');
  const cand = recruitAIState.candidates.find(c => c.id === candId);
  if (!r || !cand) return null;
  const body = {
    candidateId: candId, candidateName: cand.name,
    position: cand.position || (cand.parsed && cand.parsed.basic && cand.parsed.basic.applyPosition) || '',
    recommendation: r.recommendation, summary: r.summary,
    strengths: r.strengths || [], risks: r.risks || [],
    salarySuggestion: r.salarySuggestion || {}, createdAt: today()
  };
  return await upsertRecord('hiringDecisions', body, x => x.candidateId === candId);
}

// 试用期 → probations（按 candidateId 去重）
async function autoSaveProbation() {
  const r = recruitAIState.probationResult;
  const cand = recruitAIState._pbCand, job = recruitAIState._pbJob;
  if (!r) return null;
  const body = {
    candidateId: cand ? cand.id : null, candidateName: cand ? cand.name : '',
    position: job ? job.position : '', jobSpecId: job ? job.id : null,
    goals: r.goals || [], evalTemplate: r.evalTemplate || '',
    decisionAdvice: r.decisionAdvice || '', createdAt: today()
  };
  return await upsertRecord('probations', body, x => (cand ? x.candidateId === cand.id : false));
}

  div.innerHTML=`<input class="comp-cat" placeholder="等级" value="" style="width:80px;flex-shrink:0;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:14px"><div style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:0"><div style="display:flex;gap:8px"><input class="comp-name" placeholder="胜任力名称" value="" style="flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:14px"><input class="comp-involve" placeholder="主次" value="" style="width:80px;flex-shrink:0;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:14px"></div><textarea class="comp-desc" placeholder="描述" rows="2" style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:14px;resize:vertical"></textarea></div><button class="btn btn-danger btn-xs" onclick="this.closest('.comp-row').remove()">删除</button>`;
  editor.appendChild(div);
}
function readCompetencies(){
  const cats=[];
  document.querySelectorAll('#compEditor .comp-row').forEach(row=>{
    const catName=(row.querySelector('.comp-cat')?.value||'').trim()||'其他';
    const name=(row.querySelector('.comp-name')?.value||'').trim();
    if(!name) return;
    let cat=cats.find(c=>c.category===catName);
    if(!cat){ cat={category:catName,items:[]}; cats.push(cat); }
    cat.items.push({name, involve:row.querySelector('.comp-involve')?.value||'', desc:row.querySelector('.comp-desc')?.value||''});
  });
  return cats;
}

function editHtml(coll, it){
  if(coll==='jobSpecs'){
    return `<div class="ai-field"><label>岗位名称</label><input id="ed_position" value="${escapeHtml(it.position||'')}"></div>
      <div class="ai-field"><label>所属部门</label><input id="ed_dept" value="${escapeHtml(it.dept||'')}"></div>
      <div class="ai-field"><label>岗位层级</label><input id="ed_level" value="${escapeHtml(it.level||'')}"></div>
      <div class="ai-field"><label>岗位职责（每行一项，自动按序号展示）</label><textarea id="ed_duties" style="min-height:110px">${(it.duties||[]).map(d=>escapeHtml(d)).join('\n')}</textarea></div>
      <div class="ai-field"><label>岗位要求（每行一项，自动按序号展示）</label><textarea id="ed_requirements" style="min-height:110px">${(it.requirementsList||it.requirements||[]).map(x=>escapeHtml(x)).join('\n')}</textarea></div>
      <div class="ai-field"><label>合规提示</label><textarea id="ed_compliance">${escapeHtml(it.complianceNotes||'')}</textarea></div>
      ${competencyEditHtml(it)}`;
  }
  if(coll==='candidates'){
    return `<div class="ai-field"><label>姓名</label><input id="ed_name" value="${escapeHtml(it.name||'')}"></div>
      <div class="ai-field"><label>应聘岗位</label><input id="ed_position" value="${escapeHtml(it.position||'')}"></div>
      <div class="ai-field"><label>匹配分数</label><input id="ed_matchScore" value="${it.matchScore!=null?it.matchScore:''}"></div>
      <div class="ai-field"><label>备注标签（顿号分隔）</label><input id="ed_tags" value="${escapeHtml((it.tags||[]).join('、'))}"></div>
      <div class="ai-field"><label>解析详情（JSON，谨慎修改）</label><textarea id="ed_parsed" style="min-height:160px;font-family:monospace">${escapeHtml(JSON.stringify(it.parsed||{}, null, 2))}</textarea></div>`;
  }
  if(coll==='questionBanks'){
    return `<div class="ai-field"><label>题本标题</label><input id="ed_title" value="${escapeHtml(it.title||'')}"></div>
      <div class="ai-field"><label>候选人</label><input id="ed_candidateName" value="${escapeHtml(it.candidateName||'')}"></div>
      <div class="ai-field"><label>岗位</label><input id="ed_position" value="${escapeHtml(it.position||'')}"></div>
      <div class="ai-field"><label>题目（JSON 数组，谨慎修改）</label><textarea id="ed_questions" style="min-height:180px;font-family:monospace">${escapeHtml(JSON.stringify(it.questions||[], null, 2))}</textarea></div>`;
  }
  if(coll==='hiringDecisions'){
    return `<div class="ai-field"><label>候选人</label><input id="ed_candidateName" value="${escapeHtml(it.candidateName||'')}"></div>
      <div class="ai-field"><label>岗位</label><input id="ed_position" value="${escapeHtml(it.position||'')}"></div>
      <div class="ai-field"><label>录用建议</label><input id="ed_recommendation" value="${escapeHtml(it.recommendation||'')}"></div>
      <div class="ai-field"><label>综合评语</label><textarea id="ed_summary">${escapeHtml(it.summary||'')}</textarea></div>
      <div class="ai-field"><label>优势（JSON 数组，谨慎修改）</label><textarea id="ed_strengths" style="min-height:70px;font-family:monospace">${escapeHtml(JSON.stringify(it.strengths||[], null, 2))}</textarea></div>
      <div class="ai-field"><label>风险（JSON 数组，谨慎修改）</label><textarea id="ed_risks" style="min-height:70px;font-family:monospace">${escapeHtml(JSON.stringify(it.risks||[], null, 2))}</textarea></div>
      <div class="ai-field"><label>薪酬建议（JSON，谨慎修改）</label><textarea id="ed_salarySuggestion" style="min-height:60px;font-family:monospace">${escapeHtml(JSON.stringify(it.salarySuggestion||{}, null, 2))}</textarea></div>`;
  }
  if(coll==='probations'){
    return `<div class="ai-field"><label>候选人</label><input id="ed_candidateName" value="${escapeHtml(it.candidateName||'')}"></div>
      <div class="ai-field"><label>岗位</label><input id="ed_position" value="${escapeHtml(it.position||'')}"></div>
      <div class="ai-field"><label>阶段目标 goals（JSON 数组，谨慎修改）</label><textarea id="ed_goals" style="min-height:160px;font-family:monospace">${escapeHtml(JSON.stringify(it.goals||[], null, 2))}</textarea></div>
      <div class="ai-field"><label>评估要点说明</label><textarea id="ed_evalTemplate">${escapeHtml(it.evalTemplate||'')}</textarea></div>
      <div class="ai-field"><label>决策建议</label><textarea id="ed_decisionAdvice">${escapeHtml(it.decisionAdvice||'')}</textarea></div>`;
  }
  return '';
}

function readEdit(coll, id){
  try {
    if(coll==='jobSpecs'){
      return {
        position: val('ed_position'), dept: val('ed_dept'), level: val('ed_level'),
        duties: (val('ed_duties')||'').split('\n').map(s=>s.trim()).filter(Boolean),
        requirementsList: (val('ed_requirements')||'').split('\n').map(s=>s.trim()).filter(Boolean),
        complianceNotes: val('ed_compliance'),
        competencies: readCompetencies()
      };
    }
    if(coll==='candidates'){
      return {
        name: val('ed_name'), position: val('ed_position'),
        matchScore: val('ed_matchScore')===''?null:Number(val('ed_matchScore')),
        tags: (val('ed_tags')||'').split(/[，,、]/).map(s=>s.trim()).filter(Boolean),
        parsed: JSON.parse(val('ed_parsed')||'{}')
      };
    }
    if(coll==='questionBanks'){
      return { title: val('ed_title'), candidateName: val('ed_candidateName'), position: val('ed_position'), questions: JSON.parse(val('ed_questions')||'[]') };
    }
    if(coll==='hiringDecisions'){
      return { candidateName: val('ed_candidateName'), position: val('ed_position'), recommendation: val('ed_recommendation'), summary: val('ed_summary'), strengths: JSON.parse(val('ed_strengths')||'[]'), risks: JSON.parse(val('ed_risks')||'[]'), salarySuggestion: JSON.parse(val('ed_salarySuggestion')||'{}') };
    }
    if(coll==='probations'){
      return { candidateName: val('ed_candidateName'), position: val('ed_position'), goals: JSON.parse(val('ed_goals')||'[]'), evalTemplate: val('ed_evalTemplate'), decisionAdvice: val('ed_decisionAdvice') };
    }
  } catch(e){ showToast('编辑内容格式有误：'+e.message); return null; }
  return {};
}

function viewRecord(coll, id){
  const it = findRecord(coll, id); if(!it) return;
  showModal(`<h3>${collTitle(coll)} · 详情</h3>${detailHtml(coll,it)}<div class="modal-actions">${exportBtnHtml(coll,id)}<button class="btn btn-outline" onclick="closeModal()">关闭</button><button class="btn btn-primary" onclick="editRecord('${coll}','${id}')">编辑</button><button class="btn btn-danger" onclick="removeRecord('${coll}','${id}')">删除</button></div>`);
}
function exportBtnHtml(coll, id){
  const map = { jobSpecs:'jobSpec', candidates:'talentRegister', questionBanks:'questionBank', probations:'probationPlan' };
  let btns = '';
  if (map[coll]) btns += `<button class="btn btn-outline" onclick="exportDocx('${map[coll]}', findRecord('${coll}','${id}'))">导出 Word</button>`;
  if (coll === 'hiringDecisions') {
    btns += `<button class="btn btn-outline" onclick="exportDocx('evalReport', findRecord('${coll}','${id}'))">导出评估报告</button>`;
    btns += `<button class="btn btn-outline" onclick="exportDocx('hireProposal', findRecord('${coll}','${id}'))">导出录用建议</button>`;
  }
  return btns;
}
function currentDecisionExportData(){
  const cand = recruitAIState.candidates.find(c=>c.id===val('dc_cand'))||{};
  return Object.assign({}, recruitAIState.decisionResult||{}, { candidateName: cand.name||'', position: cand.position||'', createdAt: today() });
}
function currentProbationExportData(){
  const cand = recruitAIState._pbCand||{}, job = recruitAIState._pbJob||{};
  return Object.assign({}, recruitAIState.probationResult||{}, { candidateName: cand.name||'', position: job.position||'', createdAt: today() });
}
function editRecord(coll, id){
  const it = findRecord(coll, id); if(!it) return;
  showModal(`<h3>${collTitle(coll)} · 编辑</h3>${editHtml(coll,it)}<div class="modal-actions"><button class="btn btn-outline" onclick="viewRecord('${coll}','${id}')">取消</button><button class="btn btn-primary" onclick="saveEdit('${coll}','${id}')">保存</button></div>`);
}
async function removeRecord(coll, id){
  if(!confirm('确认删除该记录？此操作不可恢复。')) return;
  await apiDelete('/api/'+coll+'/'+id); closeModal(); showToast('已删除'); renderRecruitAI();
}
async function saveEdit(coll, id){
  const body = readEdit(coll, id); if(!body) return;
  await apiPut('/api/'+coll+'/'+id, body); closeModal(); showToast('已保存'); renderRecruitAI();
}
// 通用取值/赋值辅助
function fld(label, id, value) { return `<div class="ai-field"><label>${label}</label><input id="${id}" value="${escapeHtml(value||'')}"></div>`; }
function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }
function setVal(id, v) { const el = document.getElementById(id); if (el) el.value = v || ''; }
</script>
